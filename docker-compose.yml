services:
  postgres:
    image: postgres:17-alpine
    container_name: tfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tfa
      POSTGRES_USER: tfa
      POSTGRES_PASSWORD: tfa_dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - tfa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfa -d tfa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tfa_postgres_data:
